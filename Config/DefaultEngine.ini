[SystemSettings]
r.VolumetricCloud=0
; Single Layer Water (M_Water) reflections. r.ReflectionMethod=0 above switches the scene's
; screen-space reflections off, and by default the water follows the scene, so it would reflect
; only the sky capture. 3 forces screen-space reflections (with the sky capture as the fallback)
; on the water alone, so shallows mirror the crab and rocks. Costs one half-cost SSR pass over
; the water pixels; set it back to 1 to drop it.
r.Water.SingleLayer.Reflection=3

